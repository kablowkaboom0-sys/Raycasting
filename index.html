<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Raycasting Engine Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;image-rendering:auto}
#hud{position:fixed;top:12px;left:12px;color:#fff;background:#0009;padding:9px 12px;border-radius:8px;font:14px monospace;line-height:1.45;pointer-events:none}
#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#fff;background:#0009;padding:8px 12px;border-radius:8px;font:13px Arial;text-align:center;pointer-events:none}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<div id="help">WASD / Arrow keys: move &nbsp; | &nbsp; Space: jump &nbsp; | &nbsp; Shift: sprint &nbsp; | &nbsp; Q/E: turn</div>
<script>
"use strict";
const canvas=document.getElementById("view"),ctx=canvas.getContext("2d"),hud=document.getElementById("hud");
let W=0,H=0;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight} addEventListener("resize",resize);resize();

const map=[
"1111111111111111",
"1000000000000001",
"1000000000000001",
"1000111111000001",
"1000100001000001",
"1000100001000001",
"1000100001000001",
"1000100001000001",
"1000000001000001",
"1000000001000001",
"1000001111000001",
"1000000000000001",
"1000000000000001",
"1000000000000001",
"1000000000000001",
"1111111111111111"
];
const TILE=1, FOV=Math.PI/3, NUM_RAYS=Math.min(900,innerWidth);
const p={x:2.5,y:2.5,z:0,vz:0,a:0,ground:true};
const keys={}; addEventListener("keydown",e=>{keys[e.code]=true;if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault()});
addEventListener("keyup",e=>keys[e.code]=false);

function solid(x,y){
 const gx=Math.floor(x),gy=Math.floor(y);
 return gy<0||gy>=map.length||gx<0||gx>=map[0].length||map[gy][gx]==="1";
}
function move(dx,dy){
 const r=.20;
 if(!solid(p.x+dx+r*Math.sign(dx),p.y))p.x+=dx;
 if(!solid(p.x,p.y+dy+r*Math.sign(dy)))p.y+=dy;
}
function cast(angle){
 const dx=Math.cos(angle),dy=Math.sin(angle);
 let mx=Math.floor(p.x),my=Math.floor(p.y);
 const ddx=Math.abs(1/dx),ddy=Math.abs(1/dy);
 let sx,sy,sdx,sdy;
 if(dx<0){sx=-1;sdx=(p.x-mx)*ddx}else{sx=1;sdx=(mx+1-p.x)*ddx}
 if(dy<0){sy=-1;sdy=(p.y-my)*ddy}else{sy=1;sdy=(my+1-p.y)*ddy}
 let side=0,dist=0;
 for(let i=0;i<64;i++){
  if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}
  if(my<0||my>=map.length||mx<0||mx>=map[0].length||map[my][mx]==="1"){
   dist=side===0?sdx-ddx:sdy-ddy; break;
  }
 }
 return {dist:Math.max(.001,dist),side};
}
function render(){
 ctx.fillStyle="#79b7e8";ctx.fillRect(0,0,W,H/2);
 ctx.fillStyle="#303030";ctx.fillRect(0,H/2,W,H/2);
 const rays=Math.min(NUM_RAYS,W),step=W/rays;
 for(let i=0;i<rays;i++){
  const a=p.a-FOV/2+(i/(rays-1))*FOV;
  const hit=cast(a);
  const corrected=hit.dist*Math.cos(a-p.a);
  const wallH=Math.min(H*2,H/(corrected*1.05));
  const top=H/2-wallH/2-p.z*H*.18;
  ctx.fillStyle=hit.side?"#a8a8a8":"#c8c8c8";
  ctx.fillRect(i*step,top,step+1,wallH);
 }
 // center crosshair
 ctx.strokeStyle="#fff8";ctx.beginPath();ctx.moveTo(W/2-7,H/2);ctx.lineTo(W/2+7,H/2);ctx.moveTo(W/2,H/2-7);ctx.lineTo(W/2,H/2+7);ctx.stroke();
}
let last=performance.now();
function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 let turn=0;if(keys.KeyQ||keys.ArrowLeft)turn-=1;if(keys.KeyE||keys.ArrowRight)turn+=1;
 p.a+=turn*2.2*dt;
 let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f++;if(keys.KeyS||keys.ArrowDown)f--;if(keys.KeyA)s--;if(keys.KeyD)s++;
 const len=Math.hypot(f,s)||1;f/=len;s/=len;
 const speed=(keys.ShiftLeft||keys.ShiftRight)?4.2:2.7;
 move((Math.cos(p.a)*f-Math.sin(p.a)*s)*speed*dt,(Math.sin(p.a)*f+Math.cos(p.a)*s)*speed*dt);
 if(keys.Space&&p.ground){p.vz=4.7;p.ground=false}
 p.vz-=12*dt;p.z+=p.vz*dt;
 if(p.z<=0){p.z=0;p.vz=0;p.ground=true}
 render();
 hud.textContent="RAYCASTING ENGINE TEST\n"+
 "X: "+p.x.toFixed(2)+"  Y: "+p.y.toFixed(2)+"\n"+
 "Z: "+p.z.toFixed(2)+"  FPS: "+Math.round(1/dt);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
